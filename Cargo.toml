[package]
name = "perga"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A terminal Markdown browser with a persistent file tree, tabs, wiki-links and backlinks"
documentation = "https://docs.rs/perga"
homepage = "https://github.com/ankasoft/perga"
repository = "https://github.com/ankasoft/perga"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "tui", "terminal", "viewer", "notes"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
authors = ["ankasoft"]
exclude = [
    "/tests/fixtures",
    "/.github",
    "/packaging",
    "/demo",
    "/.githooks",
    "/AGENTS.md",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
directories = "6.0.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify = "8.2.0"
nucleo = "0.5.0"
postcard = "1.1.3"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = { version = "0.13.2", features = ["search"] }
unicode-width = "0.2.0"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"

[[bench]]
name = "render"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
