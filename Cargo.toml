[package]
name = "perga"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "A terminal Markdown browser with a persistent file tree, tabs, wiki-links and backlinks"
documentation = "https://docs.rs/perga"
homepage = "https://github.com/ankasoft/perga"
repository = "https://github.com/ankasoft/perga"
license = "MIT OR Apache-2.0"
keywords = ["markdown", "tui", "terminal", "viewer", "notes"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
authors = ["ankasoft"]
exclude = [
    "/tests/fixtures",
    "/.github",
    "/packaging",
    "/demo",
    "/.githooks",
    "/AGENTS.md",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
directories = "6.0.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify = "8.2.0"
nucleo = "0.5.0"
postcard = { version = "1.1.3", features = ["alloc"] }
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = { version = "0.13.2", features = ["search"] }
unicode-width = "0.2.0"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "vault"
harness = false

# -- Packaging ---------------------------------------------------------------
#
# Both of these expect `cargo build --release` and the auxiliary files
# generated from the built binary; see packaging/README.md.

[package.metadata.deb]
section = "utils"
priority = "optional"
extended-description = """
perga is a terminal Markdown browser: a full-screen TUI that opens a directory
of Markdown files and lets you navigate, read, search, and edit them with the
ergonomics of a document browser rather than a pager.

A persistent hierarchical sidebar, a document viewport with tabs, browser-like
back/forward history per tab, wiki-links with backlinks, and in-place editing.
"""
assets = [
    ["target/release/perga", "usr/bin/", "755"],
    ["target/assets/perga.1", "usr/share/man/man1/", "644"],
    ["target/assets/completions/perga.bash", "usr/share/bash-completion/completions/perga", "644"],
    ["target/assets/completions/perga.zsh", "usr/share/zsh/vendor-completions/_perga", "644"],
    ["target/assets/completions/perga.fish", "usr/share/fish/vendor_completions.d/perga.fish", "644"],
    ["LICENSE-MIT", "usr/share/doc/perga/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/perga/LICENSE-APACHE", "644"],
    ["README.md", "usr/share/doc/perga/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "A terminal Markdown browser"
# Both licences, as an SPDX expression, because the user picks.
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/perga", dest = "/usr/bin/perga", mode = "755" },
    { source = "target/assets/perga.1", dest = "/usr/share/man/man1/perga.1", mode = "644", doc = true },
    { source = "target/assets/completions/perga.bash", dest = "/usr/share/bash-completion/completions/perga", mode = "644" },
    { source = "target/assets/completions/perga.zsh", dest = "/usr/share/zsh/site-functions/_perga", mode = "644" },
    { source = "target/assets/completions/perga.fish", dest = "/usr/share/fish/vendor_completions.d/perga.fish", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/perga/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/perga/LICENSE-APACHE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/perga/README.md", mode = "644", doc = true },
]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
