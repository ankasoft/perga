[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Checksums to generate for each App
checksum = "sha256"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to enable GitHub Attestations
github-attestations = true

# Extra steps for the build jobs; see the file itself for why they belong there
# rather than in `extra-artifacts`.
# Kept out of `.github/workflows/` — a file of bare steps is not a valid
# workflow, and GitHub would flag every one it finds there.
github-build-setup = "../build-setup.yml"
# Everything a packager expects, in every tarball. `auto-includes` already
# picks up README.md, CHANGELOG.md, and both LICENSE files.
include = [
    "target/assets/perga.1",
    "target/assets/completions",
]

# The man page and the completions are generated by running the binary rather
# than by a build script: sharing the clap definition with a build script means
# duplicating or `#[path]`-including the CLI module, which is fragile for no
# benefit. The host build produces them — they do not vary by target — and they
# are both attached to the release and included in every archive above.
[[dist.extra-artifacts]]
build = ["bash", "packaging/generate-assets.sh"]
artifacts = [
    "target/assets/perga.1",
    "target/assets/completions/perga.bash",
    "target/assets/completions/perga.zsh",
    "target/assets/completions/perga.fish",
]

